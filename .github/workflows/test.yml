name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Run integration tests
        run: go test -v -tags=integration ./...

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          # Run coverage on production internal packages only
          # Excluded: cmd/mcpdiscord (main package - tested via integration)
          # Excluded: internal/testutil/* (test infrastructure and utilities)
          go test -coverprofile=coverage.out -covermode=atomic \
            ./internal/bot \
            ./internal/config \
            ./internal/mcp \
            ./internal/translator

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out -o=coverage.txt

      - name: Display coverage summary
        run: |
          echo "=== Code Coverage Summary ==="
          echo "Coverage for production packages: bot, config, mcp, translator"
          echo "Excluded: cmd (main package), internal/testutil (test infrastructure)"
          cat coverage.txt

      - name: Calculate total coverage
        id: coverage
        run: |
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${TOTAL_COVERAGE}%"
          echo "coverage=${TOTAL_COVERAGE}" >> $GITHUB_OUTPUT

      - name: Per-package coverage breakdown
        run: |
          echo "=== Per-Package Coverage Breakdown ==="
          go tool cover -func=coverage.out | grep -v "total:" | awk '{pkg=$1; gsub(/\/[^\/]+$/, "", pkg); cov[pkg]+=$3; count[pkg]++} END {for (p in cov) printf "%-50s %.1f%%\n", p, cov[p]/count[p]}' | sort

      - name: Enforce coverage threshold
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          MIN_THRESHOLD=95.0
          
          echo "Coverage: ${COVERAGE}%"
          echo "Production Minimum: ${MIN_THRESHOLD}%"
          echo ""
          
          # Production readiness threshold: 95% minimum
          if (( $(echo "$COVERAGE < $MIN_THRESHOLD" | bc -l) )); then
            # Below 95% - FAIL
            echo "::error::Coverage ${COVERAGE}% is below the required minimum of ${MIN_THRESHOLD}% for production deployment"
            echo "❌ FAILED: Production deployment requires at least ${MIN_THRESHOLD}% coverage"
            exit 1
          else
            # 95%+ - PASS
            echo "✅ PRODUCTION READY: Coverage ${COVERAGE}% meets production requirement of ${MIN_THRESHOLD}%"
            exit 0
          fi

      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = parseFloat('${{ steps.coverage.outputs.coverage }}');
            const minThreshold = 95.0;
            
            // Determine production readiness status
            let status, statusIcon, message;
            if (coverage < minThreshold) {
              status = 'FAIL';
              statusIcon = '❌';
              message = `Coverage is below the required minimum of ${minThreshold}% for production deployment`;
            } else {
              status = 'PRODUCTION READY';
              statusIcon = '✅';
              message = `Coverage meets production requirement of ${minThreshold}%`;
            }
            
            const coverageReport = fs.readFileSync('coverage.txt', 'utf8');
            const lines = coverageReport.split('\n').slice(0, 20).join('\n');
            
            const body = `## 📊 Code Coverage Report
            
            **Total Coverage:** ${coverage}%
            **Production Minimum:** ${minThreshold}%
            **Status:** ${statusIcon} ${status}
            
            ${message}
            
            <details>
            <summary>Coverage Details (top 20 functions)</summary>
            
            \`\`\`
            ${lines}
            \`\`\`
            
            </details>
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate
